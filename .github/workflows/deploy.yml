name: Deploy infotech

on:
  push:
    branches:
      - main
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Set environment variables
        run: |
          if [ "${{ github.ref_name }}" = "staging" ]; then
            echo "DEPLOY_PATH=/var/www/staging.zalgoinfotech.in/Zalgo_infotech" >> "$GITHUB_ENV"
            echo "PM2_NAME=zalgo-infotech-staging" >> "$GITHUB_ENV"
            echo "PORT=3016" >> "$GITHUB_ENV"
          else
            echo "DEPLOY_PATH=/var/www/zalgoinfotech.com" >> "$GITHUB_ENV"
            echo "PM2_NAME=zalgo-infotech" >> "$GITHUB_ENV"
            echo "PORT=3015" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Push DB schema (staging)
        if: github.ref_name == 'staging'
        run: npx prisma db push
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

      - name: Push DB schema (production)
        if: github.ref_name == 'main'
        run: npx prisma db push
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

      - name: Build
        run: npm run build

      - name: Assemble standalone deploy bundle
        run: |
          rm -rf deploy
          mkdir -p deploy
          cp -r .next/standalone/. deploy/
          mkdir -p deploy/.next
          cp -r .next/static deploy/.next/static
          cp -r public deploy/public

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Ensure remote directory exists
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "mkdir -p '$DEPLOY_PATH'"

      - name: Sync build to server
        run: |
          rsync -az --delete \
            --exclude='.env' \
            --exclude='public/uploads' \
            -e "ssh -i ~/.ssh/id_ed25519" \
            deploy/ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:"$DEPLOY_PATH/"

      - name: Restart app on server
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
            set -e
            cd '$DEPLOY_PATH'
            if [ ! -f .env ]; then
              echo 'WARNING: No .env found at $DEPLOY_PATH/.env — create one (see .env.example) before the app will work.'
            fi
            pm2 delete '$PM2_NAME' 2>/dev/null || true
            PORT=$PORT pm2 start server.js --name '$PM2_NAME'
            pm2 save
          "
