name: Deploy infotech

on:
  push:
    branches:
      - main
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Staging
        if: github.ref_name == 'staging'
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
            set -e

            DEPLOY_PATH='/var/www/staging.zalgoinfotech.in/Zalgo_infotech'
            REPO='https://github.com/Arvind4242/Zalgo_infotech.git'
            PM2_NAME='zalgo-infotech-staging'
            PORT=3016

            # Backup .env and user-uploaded files (not tracked in git) if they exist
            if [ -f \"\$DEPLOY_PATH/.env\" ]; then
              cp \"\$DEPLOY_PATH/.env\" /tmp/.env.staging.backup
              echo '.env backed up'
            fi
            if [ -d \"\$DEPLOY_PATH/public/uploads\" ]; then
              rm -rf /tmp/uploads.staging.backup
              cp -r \"\$DEPLOY_PATH/public/uploads\" /tmp/uploads.staging.backup
              echo 'uploads backed up'
            fi

            # Wipe and re-clone fresh
            sudo rm -rf \"\$DEPLOY_PATH\"
            git clone --branch staging \"\$REPO\" \"\$DEPLOY_PATH\"
            cd \"\$DEPLOY_PATH\"

            # Restore .env
            if [ -f /tmp/.env.staging.backup ]; then
              cp /tmp/.env.staging.backup .env
              echo '.env restored'
            else
              echo 'WARNING: No .env backup found. Create .env manually.'
            fi

            # Restore uploaded files
            if [ -d /tmp/uploads.staging.backup ]; then
              mkdir -p public
              cp -r /tmp/uploads.staging.backup public/uploads
              echo 'uploads restored'
            fi

            npm ci
            npx prisma generate
            npx prisma db push
            npm run build

            pm2 delete \"\$PM2_NAME\" 2>/dev/null || true
            PORT=\$PORT pm2 start npm --name \"\$PM2_NAME\" -- start
            pm2 save
          "

      - name: Deploy to Production
        if: github.ref_name == 'main'
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
            set -e

            DEPLOY_PATH='/var/www/zalgoinfotech.com'
            REPO='https://github.com/Arvind4242/Zalgo_infotech.git'
            PM2_NAME='zalgo-infotech'
            PORT=3015

            # Backup .env and user-uploaded files (not tracked in git) if they exist
            if [ -f \"\$DEPLOY_PATH/.env\" ]; then
              cp \"\$DEPLOY_PATH/.env\" /tmp/.env.production.backup
              echo '.env backed up'
            fi
            if [ -d \"\$DEPLOY_PATH/public/uploads\" ]; then
              rm -rf /tmp/uploads.production.backup
              cp -r \"\$DEPLOY_PATH/public/uploads\" /tmp/uploads.production.backup
              echo 'uploads backed up'
            fi

            # Wipe entire directory and re-clone fresh (removes malware too)
            sudo rm -rf \"\$DEPLOY_PATH\"
            git clone --branch main \"\$REPO\" \"\$DEPLOY_PATH\"
            cd \"\$DEPLOY_PATH\"

            # Restore .env
            if [ -f /tmp/.env.production.backup ]; then
              cp /tmp/.env.production.backup .env
              echo '.env restored'
            else
              echo 'WARNING: No .env backup found. Create .env manually.'
            fi

            # Restore uploaded files
            if [ -d /tmp/uploads.production.backup ]; then
              mkdir -p public
              cp -r /tmp/uploads.production.backup public/uploads
              echo 'uploads restored'
            fi

            npm ci
            npx prisma generate
            npx prisma db push
            npm run build

            pm2 delete \"\$PM2_NAME\" 2>/dev/null || true
            PORT=\$PORT pm2 start npm --name \"\$PM2_NAME\" -- start
            pm2 save

            # Fix ownership for the deploy user (no www-data needed — PM2 runs the Node process directly)
            sudo chown -R \$(whoami):\$(whoami) \"\$DEPLOY_PATH\"
          "
