name: Deploy infotech

on:
  push:
    branches:
      - main
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Staging
        if: github.ref_name == 'staging'
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
            set -e

            DEPLOY_PATH='/var/www/staging.zalgoinfotech.in/Zalgo_infotech'
            REPO='https://github.com/Arvind4242/Zalgo_infotech.git'

            # Backup .env if it exists
            if [ -f \"\$DEPLOY_PATH/.env\" ]; then
              cp \"\$DEPLOY_PATH/.env\" /tmp/.env.staging.backup
              echo '.env backed up'
            fi

            # Wipe and re-clone fresh
            sudo rm -rf \"\$DEPLOY_PATH\"
            git clone --branch staging \"\$REPO\" \"\$DEPLOY_PATH\"
            cd \"\$DEPLOY_PATH\"

            # Restore .env
            if [ -f /tmp/.env.staging.backup ]; then
              cp /tmp/.env.staging.backup .env
              echo '.env restored'
            else
              echo 'WARNING: No .env backup found. Create .env manually.'
            fi

            composer install
            php artisan migrate --force
            php artisan optimize
          "

      - name: Deploy to Production
        if: github.ref_name == 'main'
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
            set -e

            DEPLOY_PATH='/var/www/zalgoinfotech.com'
            REPO='https://github.com/Arvind4242/Zalgo_infotech.git'

            # Backup .env if it exists
            if [ -f \"\$DEPLOY_PATH/.env\" ]; then
              cp \"\$DEPLOY_PATH/.env\" /tmp/.env.production.backup
              echo '.env backed up'
            fi

            # Wipe entire directory and re-clone fresh (removes malware too)
            sudo rm -rf \"\$DEPLOY_PATH\"
            git clone --branch main \"\$REPO\" \"\$DEPLOY_PATH\"
            cd \"\$DEPLOY_PATH\"

            # Restore .env
            if [ -f /tmp/.env.production.backup ]; then
              cp /tmp/.env.production.backup .env
              echo '.env restored'
            else
              echo 'WARNING: No .env backup found. Create .env manually.'
            fi

            composer install --no-dev --optimize-autoloader
            php artisan migrate --force
            php artisan optimize

            # Fix permissions for web server
            sudo chown -R www-data:www-data \"\$DEPLOY_PATH\"
            sudo chmod -R 755 \"\$DEPLOY_PATH\"
            sudo chmod -R 775 \"\$DEPLOY_PATH/storage\" \"\$DEPLOY_PATH/bootstrap/cache\"
          "
