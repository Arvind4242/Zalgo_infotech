name: Deploy infotech

# The build (npm ci, prisma generate, next build) used to run over SSH on the
# production box itself. That server only has ~1.9GB RAM shared across 15+
# other hosted sites, and next build regularly OOM-killed or hit "Bus error"
# even with extra swap added — the build process needs more headroom than
# that box can reliably give it. GitHub's runners have plenty of RAM, so the
# build happens here instead; the server only ever receives an already-built
# app via rsync and does a lightweight `pm2 restart` — no install, no build.

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Apply database schema
        run: npx prisma db push
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

      - name: Set deploy variables
        id: vars
        run: |
          if [ "${{ github.ref_name }}" = "staging" ]; then
            echo "deploy_path=/var/www/staging.zalgoinfotech.in/Zalgo_infotech" >> "$GITHUB_OUTPUT"
            echo "pm2_name=zalgo-infotech-staging" >> "$GITHUB_OUTPUT"
            echo "port=3016" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_path=/var/www/zalgoinfotech.com" >> "$GITHUB_OUTPUT"
            echo "pm2_name=zalgo-infotech" >> "$GITHUB_OUTPUT"
            echo "port=3015" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Ensure deploy directory exists
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "mkdir -p '${{ steps.vars.outputs.deploy_path }}'"

      # --delete removes files on the server that no longer exist in this
      # build, but everything excluded below is left untouched by rsync
      # entirely (not compared, not deleted) — .env and real user uploads on
      # the server are never at risk here.
      - name: Sync built app to server
        run: |
          rsync -avz --delete \
            --exclude='.env' \
            --exclude='.git' \
            --exclude='public/uploads' \
            --exclude='.next/cache' \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ steps.vars.outputs.deploy_path }}/"

      - name: Restart app on server
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
            set -e
            cd '${{ steps.vars.outputs.deploy_path }}'
            pm2 delete '${{ steps.vars.outputs.pm2_name }}' 2>/dev/null || true
            PORT=${{ steps.vars.outputs.port }} pm2 start npm --name '${{ steps.vars.outputs.pm2_name }}' -- start
            pm2 save
          "
